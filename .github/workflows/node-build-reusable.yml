name: Reusable Node Build

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'   # enables caching automatically

      - name: Install & Test
        run: |
          npm install
          npm test

      # Build Docker image with dynamic Node version
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NODE_VERSION=${{ inputs.node-version }} \
            -t myapp:${{ inputs.node-version }} .

      # Optional: Push to registry
      - name: Tag Image
        run: |
          docker tag myapp:${{ inputs.node-version }} myrepo/myapp:${{ inputs.node-version }}
