---
name: Reusable Node Build
on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      environment:
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Debug context
        run: |
          echo "ENV: ${{ inputs.environment }}"
          echo "Vars context:"
          echo "${{ toJson(vars) }}"

      - name: Debug variables
        run: |
          echo "Region is set?"
          if [ -z "$AWS_REGION" ]; then echo "AWS_REGION EMPTY"; else echo "AWS_REGION OK"; fi

          echo "Role is set?"
          if [ -z "$AWS_ROLE_ARN" ]; then echo "AWS_ROLE_ARN EMPTY"; else echo "AWS_ROLE_ARN OK"; fi

        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

      - name: Install & Test
        run: |
          npm install
          npm test
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NODE_VERSION=${{ inputs.node-version }} \
            -t myapp:${{ inputs.node-version }} .
      - name: Tag Image
        run: >
          docker tag myapp:${{ inputs.node-version }} myrepo/myapp:${{
          inputs.node-version }}

